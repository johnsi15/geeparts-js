<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Black Friday Geeparts - Modal promocional</title>
    <link rel="stylesheet" href="modal-black-friday/styles.css" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #141414;
        color: #f5f5f5;
        font-family: sans-serif;
      }
      main { max-width: 560px; }
      .eyebrow {
        color: #ffd700;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 16px 0; }
      p { color: #bbb; line-height: 1.6; }
      #open-demo {
        margin-top: 16px;
        padding: 14px 24px;
        border: 0;
        border-radius: 4px;
        background: #ffd700;
        color: #141414;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
      a { color: #ffd700; }
      /* El componente abre con display:flex, sin añadir la clase active. */
      .modal-blackfriday-overlay {
        justify-content: center;
        align-items: center;
        padding: 56px 16px 24px;
      }
      .modal-blackfriday-overlay .modal-content { max-width: 100%; }
      .modal-blackfriday-overlay .modal-content img {
        display: block;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: calc(100vh - 100px);
        max-height: calc(100dvh - 100px);
      }
      .image-error {
        max-width: 420px;
        padding: 24px;
        background: #222;
        border: 1px solid #666;
      }
      .image-error p { margin: 0; }
      @media (prefers-reduced-motion: reduce) {
        .modal-blackfriday-overlay,
        .modal-blackfriday-overlay .modal-content { animation: none; }
        .modal-blackfriday-overlay .close-btn { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">Geeparts / Demo</span>
      <h1>Modal Black Friday</h1>
      <p>
        Esta es la promoción emergente original, sin contador. Se abre automáticamente
        después de un segundo. Ciérrala con la X o haciendo clic fuera de la imagen.
      </p>
      <button type="button" id="open-demo">Volver a abrir el modal</button>
      <p><a href="demo-black-friday-countdown.html">Ver la demo del banner con contador →</a></p>
    </main>
    <script src="modal-black-friday/index.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const overlay = document.getElementById('modalBlackfridayOverlay')
        const closeButton = document.getElementById('closeBtn')
        const image = document.getElementById('modalImage')
        closeButton.type = 'button'
        closeButton.setAttribute('aria-label', 'Cerrar promoción Black Friday')
        document.getElementById('modalContent').setAttribute('role', 'dialog')
        document.getElementById('modalContent').setAttribute('aria-label', 'Promoción Black Friday')

        document.getElementById('open-demo').addEventListener('click', function () {
          overlay.style.display = 'flex'
          closeButton.focus()
        })

        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape' && overlay.style.display === 'flex') {
            closeButton.click()
            document.getElementById('open-demo').focus()
          }
        })

        function showImageError() {
          if (document.getElementById('image-error')) return
          image.hidden = true
          image.style.display = 'none'
          const message = document.createElement('div')
          message.id = 'image-error'
          message.className = 'image-error'
          message.setAttribute('role', 'status')
          message.innerHTML =
            '<p>No se pudo cargar la imagen de la promoción. Comprueba que la URL sea pública.</p>'
          image.after(message)
        }

        image.addEventListener('error', showImageError)
        if (image.complete && image.naturalWidth === 0) showImageError()
      })
    </script>
  </body>
</html>
