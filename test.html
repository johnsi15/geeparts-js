<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Black Friday - Contador Regresivo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Arial', sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000;
        overflow: hidden;
      }

      .container {
        position: relative;
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .background-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }

      .countdown-wrapper {
        position: relative;
        z-index: 2;
        margin-top: 575px;
        text-align: center;
      }

      .countdown-title {
        color: #ffd700;
        font-size: 2rem;
        font-weight: bold;
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-shadow:
          0 0 20px rgba(255, 215, 0, 0.5),
          0 0 40px rgba(255, 215, 0, 0.3),
          2px 2px 4px rgba(0, 0, 0, 0.8);
      }

      .countdown {
        display: flex;
        gap: 20px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .countdown-item {
        background: rgba(0, 0, 0, 0.8);
        border: 3px solid #ffd700;
        border-radius: 15px;
        padding: 25px 30px;
        min-width: 120px;
        box-shadow:
          0 0 30px rgba(255, 215, 0, 0.4),
          inset 0 0 20px rgba(255, 215, 0, 0.1);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .countdown-item:hover {
        transform: translateY(-5px);
        box-shadow:
          0 0 40px rgba(255, 215, 0, 0.6),
          inset 0 0 30px rgba(255, 215, 0, 0.2);
      }

      .countdown-number {
        font-size: 3.5rem;
        font-weight: bold;
        color: #ffd700;
        line-height: 1;
        text-shadow:
          0 0 10px rgba(255, 215, 0, 0.8),
          0 0 20px rgba(255, 215, 0, 0.5);
        display: block;
        margin-bottom: 10px;
      }

      .countdown-label {
        font-size: 1rem;
        color: #fff;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
      }

      .pulse {
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      @media (max-width: 768px) {
        .countdown-title {
          font-size: 1.5rem;
        }

        .countdown {
          gap: 10px;
        }

        .countdown-item {
          padding: 15px 20px;
          min-width: 80px;
        }

        .countdown-number {
          font-size: 2.5rem;
        }

        .countdown-label {
          font-size: 0.8rem;
        }

        .countdown-wrapper {
          margin-top: 250px;
        }
      }
    </style>
  </head>
  <body>
    <!-- https://cdn.jsdelivr.net/npm/geeparts-js@1.5.16/dist/geeparts-newsletter.min.js -->
    <!-- <h1>Test Newsletter</h1> -->
    <!-- <script>
      window.geepartsNewsletterConfig = {
        autoOpen: true,
        autoOpenDelay: 500,
        couponCode: 'SUMMER25',
      }
    </script> -->
    <!-- <script src="dist/geeparts-newsletter.min.js"></script> -->

    <div class="container">
      <img
        src="https://download.geeparts.co/banner%20black%20friday%20reloj%20(1).png"
        alt="Background"
        class="background-image"
        id="bgImage"
      />

      <div class="countdown-wrapper">
        <div class="countdown" id="countdown">
          <div class="countdown-item">
            <span class="countdown-number" id="days">00</span>
            <span class="countdown-label">Días</span>
          </div>
          <div class="countdown-item">
            <span class="countdown-number" id="hours">00</span>
            <span class="countdown-label">Horas</span>
          </div>
          <div class="countdown-item">
            <span class="countdown-number" id="minutes">00</span>
            <span class="countdown-label">Minutos</span>
          </div>
          <div class="countdown-item">
            <span class="countdown-number" id="seconds">00</span>
            <span class="countdown-label">Segundos</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Configura aquí la fecha del Black Friday (Año, Mes-1, Día, Hora, Minuto)
      // Nota: Los meses en JavaScript van de 0-11, por lo que noviembre es 10
      const blackDaysDate = new Date(2025, 10, 19, 0, 0, 0).getTime()

      function updateCountdown() {
        const now = new Date().getTime()
        const distance = blackDaysDate - now

        if (distance < 0) {
          document.getElementById('countdown').innerHTML =
            '<h2 style="color: #FFD700; font-size: 3rem; text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);">¡BLACK DAYS YA ESTÁ AQUÍ!</h2>'
          return
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24))
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60))
        const seconds = Math.floor((distance % (1000 * 60)) / 1000)

        document.getElementById('days').textContent = String(days).padStart(2, '0')
        document.getElementById('hours').textContent = String(hours).padStart(2, '0')
        document.getElementById('minutes').textContent = String(minutes).padStart(2, '0')
        document.getElementById('seconds').textContent = String(seconds).padStart(2, '0')
      }

      // Actualizar cada segundo
      updateCountdown()
      setInterval(updateCountdown, 1000)

      // Cargar la imagen de fondo que subiste
      // IMPORTANTE: Reemplaza la URL a continuación con la URL de tu imagen
      // document.getElementById('bgImage').src = 'tu-imagen-aqui.jpg';
    </script>
  </body>
</html>
